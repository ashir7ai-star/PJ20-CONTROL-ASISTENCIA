# Publishes the Fase 1 prototype (static PWA, example data only) to GitHub Pages
# on every push to main. Skipped automatically while the repository is private
# (GitHub Pages is unavailable for private repos on the free plan).
name: Prototipo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar prototipo
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Compilar con la ruta de GitHub Pages
        run: pnpm --filter @pj20/app build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Static demo: no API on GitHub Pages, "/" opens the prototype index.
          VITE_MODO: prototipo
      # GitHub Pages has no SPA rewrites: serve the app for any unknown path,
      # so reloading /prototipo/admin (or sharing that link) works.
      - run: cp app/dist/index.html app/dist/404.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
