name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (formato, lint, tipos, pruebas, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Scripts de respaldos (shellcheck)
        run: shellcheck -s sh -S warning ops/respaldos/*.sh

  integration:
    name: Integración (Postgres, Redis, S3 reales · API de punta a punta)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway credentials, valid only inside this ephemeral runner.
    env:
      POSTGRES_USER: pj20
      POSTGRES_PASSWORD: ci-postgres
      POSTGRES_DB: pj20
      REDIS_PASSWORD: ci-redis
      S3_ACCESS_KEY: ci-access
      S3_SECRET_KEY: ci-secret-key
      S3_BUCKET: pj20-selfies
      APP_ORIGINS: http://localhost:5173
      DATABASE_MIGRATION_URL: postgres://pj20:ci-postgres@localhost:15432/pj20
      DATABASE_URL: postgres://pj20_api:ci-api-user-password@localhost:15432/pj20
      GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
      REDIS_URL: redis://:ci-redis@localhost:16379
      S3_ENDPOINT: http://localhost:19000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - name: Migraciones y usuario restringido de la API (igual que en producción)
        run: pnpm db:migrate && pnpm db:usuario-app
      - run: pnpm test:integration
      - name: Respaldos (D8) — copia cifrada y restauración de punta a punta
        env:
          BACKUP_DATABASE_URL: postgres://pj20_respaldos:ci-backup-user-password@localhost:15432/pj20
          RESTORE_URL: postgres://pj20:ci-postgres@localhost:15432/pj20_restauracion
        run: |
          pnpm admin:crear ci@blazarenergy.co "Prueba CI"
          (cd backend && npx tsx src/db/setup-backup-user.ts)
          docker build -f ops/respaldos/Dockerfile -t pj20-respaldos:ci .
          mkdir -p /tmp/destino && chmod 777 /tmp/destino
          run() {
            docker run --rm --network host -v /tmp/destino:/destino \
              -e BACKUP_DATABASE_URL -e RESPALDOS_DESTINO=/destino \
              -e RESPALDOS_CLAVE=ci-clave -e RESPALDOS_SAL=ci-sal \
              -e S3_ENDPOINT -e S3_ACCESS_KEY -e S3_SECRET_KEY -e S3_BUCKET \
              pj20-respaldos:ci "$@"
          }
          # The selfies bucket (created by the API at boot in production) with one photo.
          run sh -c '. /app/configurar.sh && rclone mkdir "fotos:$S3_BUCKET" && echo prueba | rclone rcat "fotos:$S3_BUCKET/selfies/prueba.jpg"'
          run respaldar todo
          run restaurar listar
          # Encrypted names: nothing recognizable leaves the server.
          test -z "$(find /tmp/destino -iname '*pj20*')"
          run psql "$DATABASE_MIGRATION_URL" -c "CREATE DATABASE pj20_restauracion"
          run restaurar base "diaria/pj20-$(TZ=America/Bogota date +%F).dump" "$RESTORE_URL"
          cd backend
          diff <(npx tsx src/cli/count-records.ts | tail -n +2) \
            <(npx tsx src/cli/count-records.ts "$RESTORE_URL" | tail -n +2)
      - if: failure()
        run: docker compose logs

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f backend/Dockerfile -t pj20-backend:ci .
      - run: docker build -f app/Dockerfile --build-arg VITE_GOOGLE_CLIENT_ID=ci-imagen.apps.googleusercontent.com --build-arg VITE_PUBLIC_URL=https://ci.example.com -t pj20-app:ci .
      - name: El Client ID de Google queda incluido en la app
        run: docker run --rm --entrypoint sh pj20-app:ci -c 'grep -rlq ci-imagen.apps.googleusercontent.com /usr/share/nginx/html/assets'
      - name: La vista previa del enlace (logo al compartir) queda configurada
        run: docker run --rm --entrypoint sh pj20-app:ci -c 'grep -q "og:image\" content=\"https://ci.example.com/og-image.jpg\"" /usr/share/nginx/html/index.html && test -s /usr/share/nginx/html/og-image.jpg'
      - name: Sin Client ID la imagen de la app no compila
        run: '! docker build -f app/Dockerfile -t pj20-app:sin-id .'
      - run: docker build -f ops/respaldos/Dockerfile -t pj20-respaldos:ci .
      - name: Las imágenes no corren como root
        run: |
          test "$(docker run --rm --entrypoint id pj20-backend:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id pj20-app:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id pj20-respaldos:ci -u)" != "0"

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (historial completo)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose
