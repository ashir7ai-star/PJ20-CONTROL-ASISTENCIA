<!doctype html>
<!--
  Fuente de app/public/og-image.png (vista previa al compartir el enlace).
  Para regenerarla: abrir este archivo en un navegador a 1200×630 px y capturar
  la ventana (o usar la herramienta de capturas por CDP del proyecto).
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Vista previa · Control de Asistencia</title>
    <style>
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('../../../../app/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
          format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        font-family: 'Inter', system-ui, sans-serif;
        color: #ffffff;
        /* Azul marino de la marca con un halo suave del verde del logo. */
        background:
          radial-gradient(circle at 50% 46%, rgba(16, 185, 129, 0.16), transparent 58%),
          radial-gradient(circle at 50% 120%, rgba(14, 165, 233, 0.18), transparent 60%), #0a1f3c;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      img {
        width: 640px;
        height: auto;
      }
      h1 {
        margin: 36px 0 0;
        font-size: 46px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: #cbd5e1;
      }
      .rule {
        margin-top: 40px;
        width: 72px;
        height: 4px;
        border-radius: 2px;
        background: #10b981;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../../../../app/src/assets/brand/logo-dark.png" alt="BLAZAR ENERGY" />
      <h1>Control de Asistencia</h1>
      <div class="rule"></div>
    </main>
  </body>
</html>
