# Serves the PWA. In Easypanel, /api is routed to the backend service before reaching here.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers (repeated in every location that adds its own headers).
  # Google Sign-In (Identity Services) is the only third party allowed.
  set $csp "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  # Hashed build assets: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # SPA entry point: always revalidate so users get new releases immediately.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    try_files $uri $uri/ /index.html;
  }

  # Liveness probe for the container itself.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }
}
